<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000">
<title>Jugando — RetroHub Web</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* 100vh mide mal en iPad Safari; dvh se ajusta a la zona visible real */
  #game { width: 100vw; height: 100vh; height: 100dvh; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #eee; font-family: -apple-system, system-ui, sans-serif; flex-direction: column; gap: 10px;
  }
  /* Botón volver: pequeño, se auto-oculta a los 3s; tocar la franja superior lo recupera */
  #back {
    position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; z-index: 40;
    width: 40px; height: 40px; border-radius: 50%;
    background: #0008; color: #fff; border: 1px solid #ffffff44;
    font-size: 1.1rem; cursor: pointer; padding: 0;
    transition: opacity .35s;
  }
  #back.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<button id="back" aria-label="Volver a la biblioteca" onclick="location.href='index.html'">←</button>
<div id="loading">Cargando juego…</div>
<div id="game"></div>

<script src="idb.js"></script>
<script>
/* global RetroDB */

const params = new URLSearchParams(location.search);
const id = Number(params.get("id"));

// --- Botón volver auto-ocultable ---
const backBtn = document.getElementById("back");
let hideTimer;
function showBack() {
  backBtn.classList.remove("hidden");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => backBtn.classList.add("hidden"), 3000);
}
showBack();
document.addEventListener("pointerdown", (e) => {
  if (e.clientY < 70 && !backBtn.contains(e.target)) showBack();
}, { passive: true });

async function boot() {
  const rom = await RetroDB.get(id);
  if (!rom) {
    document.getElementById("loading").textContent = "ROM no encontrada.";
    return;
  }
  const romUrl = URL.createObjectURL(rom.blob);

  // Config EmulatorJS (núcleos servidos desde CDN oficial, versión fijada)
  window.EJS_player = "#game";
  window.EJS_core = rom.console;          // gb | gba | nes | snes | n64 | nds
  window.EJS_gameName = rom.name.replace(/\.[^.]+$/, "");
  window.EJS_gameID = rom.id;             // partidas separadas por juego
  window.EJS_gameUrl = romUrl;
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/4.2.3/data/";
  window.EJS_startOnLoaded = true; // 1 clic: arranca directo sin pantalla de inicio
  window.EJS_startButton = false;
  window.EJS_color = "#3b82f6";
  window.EJS_fullscreenOnLoaded = false;
  window.EJS_onExit = () => { location.href = "index.html"; };
  // Las partidas (SRAM/estados) se guardan en IndexedDB del navegador.

  const script = document.createElement("script");
  script.src = "https://cdn.emulatorjs.org/4.2.3/data/loader.js";
  script.onload = () => document.getElementById("loading").remove();
  script.onerror = () => {
    document.getElementById("loading").textContent =
      "No se pudo cargar el emulador (¿sin conexión?).";
  };
  document.body.appendChild(script);
}

boot();
</script>
</body>
</html>
